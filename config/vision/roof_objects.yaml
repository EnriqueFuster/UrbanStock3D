task_name: roof_objects
task_type: instance_segmentation
taxonomy_version: "1.0"
dataset_id: rid2-v1.0-canonical-v1

model:
  family: ultralytics
  checkpoint: models/pretrained/yolo26s-seg.pt
  pretrained: true

input:
  image_size: 1024
  tiling: true
  overlap: 0.20

training:
  image_size: 512
  epochs: 100
  batch_size: 8
  seed: 42
  early_stopping_patience: 20

tracking:
  experiment: urbanstock/roof_objects

export:
  formats: [onnx]
