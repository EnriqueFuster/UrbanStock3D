[project]
name = "urbanstock3d"
version = "0.1.0"
description = "Open-data semantic building intelligence for Spain."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "pyproj>=3.7,<4",
    "typer>=0.17,<1",
]

[project.scripts]
urbanstock = "urbanstock3d.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
