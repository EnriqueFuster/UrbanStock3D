[project]
name = "urbanstock3d"
version = "0.1.0"
description = "Open-data semantic building intelligence for Spain."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "laspy>=2.6,<3",
    "lazrs>=0.7,<1",
    "numpy>=2.3,<3",
    "pillow>=11.3,<13",
    "pydantic-settings>=2.10,<3",
    "pyproj>=3.7,<4",
    "scipy>=1.16,<2",
    "typer>=0.17,<1",
]

[project.scripts]
urbanstock = "urbanstock3d.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "matplotlib>=3.10,<4",
    "mypy>=1.17,<2",
    "nbformat>=5.10,<6",
    "plotly>=6,<7",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<0.13",
    "shapely>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["laspy", "laspy.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
